services:
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      POST: 1
      DELETE: 1
      PING: 1
      VERSION: 1
      EXEC: 0
      BUILD: 0
      VOLUMES: 0
      SERVICES: 0
      TASKS: 0
      SWARM: 0
      SYSTEM: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - wake-control

  redis:
    build: .
    restart: unless-stopped
    read_only: true
    environment:
      DOCKER_HOST: tcp://docker-proxy:2375
      WAKE_IMAGE: redis:7.2-alpine
      WAKE_IDLE: ${WAKE_IDLE:-15m}
      WAKE_PULL: missing
      WAKE_CONTROL_NETWORKS: wake-control
    volumes:
      - redis-data:/data
    networks:
      - default
      - wake-control
    depends_on:
      - docker-proxy

volumes:
  redis-data:

networks:
  wake-control:
    internal: true
